<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinted Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --texto:#735c53;
    --boton:#deb8a0;
    --borde:#735c53;
    --fondo-arriba:#faeee4;
    --fondo-abajo:#fdf6f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    color:var(--texto);
    background:linear-gradient(180deg,var(--fondo-arriba),var(--fondo-abajo));
    background-attachment:fixed;
    display:flex;justify-content:center;
  }
  .pagina{width:100%;max-width:560px;padding:40px 22px 48px;text-align:center}
  .avatar{
    width:150px;height:150px;border-radius:50%;
    border:3px solid var(--borde);background:#fff;
    object-fit:cover;display:block;margin:0 auto 22px;
  }
  h1{font-family:'Libre Baskerville',serif;font-weight:400;font-size:2.4rem;margin-bottom:18px}
  .redes{display:flex;justify-content:center;gap:26px;margin-bottom:34px}
  .redes a{color:var(--texto);display:inline-flex;transition:transform .15s}
  .redes a:hover{transform:scale(1.12)}
  .redes svg{width:30px;height:30px;fill:currentColor}
  .redes .mail svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

  .enlaces{display:flex;flex-direction:column;gap:20px}
  .boton{
    position:relative;display:flex;align-items:center;justify-content:center;
    min-height:66px;padding:0 54px;
    background:var(--boton);border:3px solid var(--borde);border-radius:14px;
    color:var(--texto);text-decoration:none;font-size:1.15rem;
    transition:transform .15s, box-shadow .15s;
  }
  .boton:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(115,92,83,.25)}
  .boton:active{transform:scale(.98)}
  .boton .icono{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  }
  .boton .icono svg{width:100%;height:100%}
  .boton .puntos{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:3px;
  }
  .boton .puntos i{width:5px;height:5px;border-radius:50%;background:var(--texto);opacity:.8}

  .pie{margin-top:80px;display:flex;justify-content:center}
  .pie a{display:inline-flex;align-items:center;gap:10px;color:var(--texto);text-decoration:none;font-weight:600;font-size:1.7rem}
  .pie svg{width:38px;height:38px;fill:var(--texto)}
</style>
</head>
